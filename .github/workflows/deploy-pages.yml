# Builds the React dashboard and deploys it to GitHub Pages.
# The dashboard talks to the backend running on AWS (EC2 behind CloudFront HTTPS).
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # AWS backend endpoint (CloudFront HTTPS in front of the EC2 instance)
      REACT_APP_API_URL: https://dbdya97c8baq2.cloudfront.net/api
      REACT_APP_SOCKET_URL: https://dbdya97c8baq2.cloudfront.net
      # Site is served from https://<user>.github.io/<repo>/
      PUBLIC_URL: /${{ github.event.repository.name }}
      # Don't fail the build on lint warnings
      CI: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
